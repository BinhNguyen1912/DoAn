[project]
name = "edge-ai"
version = "0.1.0"
description = "Safe Zone Monitor edge service: webcam, person detection, zone logic"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "numpy",
  "opencv-python",
  "ultralytics",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
